version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: terraform
    directories:
      - "/modules/*"
      - "/example"
      - "/atlantis-server/terraform"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      terraform:
        patterns:
          - "*"
