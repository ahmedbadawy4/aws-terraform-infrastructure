name: Pre-commit
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.4.6"
  TERRAGRUNT_VERSION: "v0.67.14"
  TERRAFORM_DOCS_VERSION: "v0.19.0"

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # pre-commit needs the full history to compare the two commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v6
      - name: Install Terragrunt
        run: |
          BASE_URL="https://github.com/gruntwork-io/terragrunt/releases/download/${TERRAGRUNT_VERSION}"
          curl -fsSL -o terragrunt "${BASE_URL}/terragrunt_linux_amd64"
          curl -fsSL -o SHA256SUMS "${BASE_URL}/SHA256SUMS"
          EXPECTED=$(grep -E '[ *]terragrunt_linux_amd64$' SHA256SUMS | cut -d ' ' -f 1)
          echo "${EXPECTED}  terragrunt" | sha256sum --check
          sudo install -m 0755 terragrunt /usr/local/bin/terragrunt
      - name: Install terraform-docs
        run: |
          BASE_URL="https://github.com/terraform-docs/terraform-docs/releases/download/${TERRAFORM_DOCS_VERSION}"
          ARCHIVE="terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          curl -fsSL -o "${ARCHIVE}" "${BASE_URL}/${ARCHIVE}"
          curl -fsSL -o terraform-docs.sha256sum "${BASE_URL}/terraform-docs-${TERRAFORM_DOCS_VERSION}.sha256sum"
          EXPECTED=$(grep -F "${ARCHIVE}" terraform-docs.sha256sum | cut -d ' ' -f 1)
          echo "${EXPECTED}  ${ARCHIVE}" | sha256sum --check
          tar -xzf "${ARCHIVE}" terraform-docs
          sudo install -m 0755 terraform-docs /usr/local/bin/terraform-docs
      - uses: pre-commit/action@v3.0.1
        with:
          # A pull request checks only the files it changes. A push to main and a
          # manual run check every file.
          extra_args: ${{ github.event_name == 'pull_request' && format('--from-ref {0} --to-ref {1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '--all-files' }}
